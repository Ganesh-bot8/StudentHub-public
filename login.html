
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudentHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f5fb;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            color: #3867e8;
            font-size: 27px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #202944;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce1ed;
            border-radius: 8px;
            margin-bottom: 18px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #3867e8;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3867e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2854d2;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .register-link a {
            color: #3867e8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">StudentHub</div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to continue your learning journey.
        </p>

        <form id="login-form">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="login-button">
                Login
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </div>

    <script>
        const API_BASE = "https://studenthub-api-ucq9.onrender.com";

        const form = document.getElementById("login-form");
        const message = document.getElementById("message");
        const button = document.getElementById("login-button");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            button.disabled = true;
            button.textContent = "Logging in...";
            message.textContent = "";

            try {
                const response = await fetch(
                    `${API_BASE}/api/login`,
                    {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Login failed.");
                }

                message.style.color = "green";
                message.textContent =
                    "Login successful! Opening StudentHub...";

                setTimeout(function() {
                    window.location.href = "index.html";
                }, 1000);

            } catch (error) {
                console.error("Login error:", error);

                message.style.color = "red";
                message.textContent =
                    error.message === "Failed to fetch"
                    ? "Cannot connect to StudentHub server. Please try again."
                    : error.message;

            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });
    </script>

</body>
</html>
