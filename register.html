
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | StudentHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f5fb;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            color: #3867e8;
            font-size: 27px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #202944;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce1ed;
            border-radius: 8px;
            margin-bottom: 17px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #3867e8;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3867e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2854d2;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        #message a {
            color: #3867e8;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #3867e8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">StudentHub</div>

        <h2>Create Your Account</h2>

        <p class="subtitle">
            Join StudentHub and start learning.
        </p>

        <form id="register-form">

            <label for="full-name">Full Name</label>
            <input
                type="text"
                id="full-name"
                placeholder="Enter your full name"
                maxlength="80"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <label for="confirm-password">Confirm Password</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Enter your password again"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="register-button">
                Create Account
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

    <script>
        const form = document.getElementById("register-form");
        const message = document.getElementById("message");
        const button = document.getElementById("register-button");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const fullName = document.getElementById("full-name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            message.textContent = "";

            if (password !== confirmPassword) {
                message.style.color = "red";
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            button.textContent = "Creating account...";

            try {

                const response = await fetch(
                    "http://127.0.0.1:5000/api/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            full_name: fullName,
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (response.status === 409) {
                    message.style.color = "red";
                    message.innerHTML =
                        'This email is already registered. <a href="login.html">Login here</a>.';
                    return;
                }

                if (!response.ok) {
                    throw new Error(data.error || "Registration failed.");
                }

                message.style.color = "green";
                message.textContent =
                    "Account created successfully! Redirecting to login...";

                form.reset();

                setTimeout(function() {
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {

                message.style.color = "red";

                message.textContent =
                    error.message === "Failed to fetch"
                    ? "Cannot connect to StudentHub server. Check whether the backend is running."
                    : error.message;

            } finally {

                button.disabled = false;
                button.textContent = "Create Account";

            }
        });
    </script>

</body>
</html>
